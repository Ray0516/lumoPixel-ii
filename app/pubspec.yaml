name: flutter_application_1
description: "Lumo Pixel Go Camera App"
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  gal: ^2.3.2
  image: ^4.8.0
  shared_preferences: ^2.5.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png" # 這裡指向你剛剛設定好的圖標路徑
  adaptive_icon_background: "#1A1410"  # 背景色，建議用你的暖色底色
  adaptive_icon_foreground: "assets/images/icon.png"